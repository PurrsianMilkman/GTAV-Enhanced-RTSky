; RTSky - ray-traced sky lighting for GTA V Enhanced
; Place next to RTSky.asi (game folder). Reload in game with Numpad0.

[General]
Enabled=1
; 0 error, 1 warning, 2 info, 3 debug
LogLevel=2

[Hotkeys]
; Key names (Numpad0-Numpad9, NumpadAdd, NumpadSubtract, NumpadMultiply, NumpadDivide,
; NumpadDecimal, F1-F12, Insert, Delete, Home, End, PageUp, PageDown), a virtual-key code such as
; 0x61, or None. The numpad digits need NumLock on. Every key shows a short confirmation on screen.
; RTSky on / off
Toggle=Numpad1
; On-screen status lines (top left)
Overlay=Numpad2
; Split-screen compare: left half untouched, right half relit
Compare=Numpad3
; Relight even while the camera calibration has not passed (see [Camera] ForceRelight)
ForceRelight=Numpad4
; Next debug view
DebugView=Numpad5
; Sun / moon shadow rays on / off
SunShadows=Numpad6
; Foliage mode: stochastic -> opaque -> ignored
Foliage=Numpad7
; Near-field split on / off (off = NearFieldRadius 0)
NearField=Numpad8
; Trace path: DXR pipeline <-> inline RayQuery
TracePath=Numpad9
; Reload this file
Reload=Numpad0
; Write the next frame's structure to RTSky_frame.log
DumpFrame=NumpadDecimal
; Strength +0.1 / -0.1
StrengthUp=NumpadAdd
StrengthDown=NumpadSubtract
; Spatial denoiser on / off
Denoiser=NumpadMultiply
; Reset the temporal history and the camera calibration
Reset=NumpadDivide

[Display]
; Status lines in the top-left corner: what RTSky is doing, or the first thing stopping it.
Overlay=1
; Start with the split-screen compare on
Compare=0

[Trace]
; pipeline = DXR state object (raygen / miss / any-hit), inline = DXR 1.1 RayQuery compute shader
Path=pipeline
; Sky rays per pixel per frame (1-16). The temporal filter accumulates ~32 frames.
RaysPerPixel=1
; Longest sky ray in metres. Geometry outside the game's own RT range is never hit anyway.
MaxRayDistance=400
; Ray origin offset along the surface normal: NormalBias + DistanceBias * viewDistance (metres).
; Raise if flat surfaces shadow themselves (the game's RT geometry is a lower LOD than the raster).
NormalBias=0.03
DistanceBias=0.002
TMin=0.01
; Occluders closer than this (metres) are left to the game's own AO (baked AO, SSAO, RTAO), so that
; corners are not darkened twice. Set to 0 to trace full sky visibility (e.g. with RTAO off).
NearFieldRadius=1.0
; Instance mask passed to TraceRay (0xFF = everything in the game's scene BVH).
InstanceMask=0xFF
; Alpha-tested geometry (leaves, fences): stochastic = partial coverage, opaque = solid cards,
; ignore = no occlusion. The game's alpha textures are not accessible to RTSky.
FoliageMode=stochastic
FoliageOpacity=0.6
FoliageCells=6
; One sun/moon visibility ray per pixel (weights the direct light in the relighting ratio).
SunShadowRays=1
; Sun disc radius multiplier for soft shadow rays.
SunSoftness=4.0

[Denoise]
MaxHistory=32
; Reprojection rejection: relative depth difference, minimum normal cosine
DepthReject=0.05
NormalReject=0.9
; a-trous iterations (0-5)
Iterations=4
SigmaPlane=0.02
NormalPower=64
SigmaLuminance=4

[Composite]
; Overall blend of the ray-traced sky relighting (0 = off, 1 = full)
Strength=0.85
; Clamp of the per-pixel lighting multiplier
MinRatio=0.3
MaxRatio=1.0
; How much of the sky the game itself already considers visible (1 = the game's ambient is unoccluded)
GameSkyOcclusion=1.0
; Weight of direct sun/moon light in the ratio (keeps sunlit surfaces from being darkened)
DirectScale=1.0
; Non-sky ambient light (street lights, interiors, the game's GI) in units of the sun's illuminance.
; Keeps nights and indoor areas from going black.
ArtificialAmbient=0.02
; Albedo of the ground used for the (unchanged) ground-bounce term
GroundAlbedo=0.2
; Skip pixels closer than this (first-person weapon / body), metres
NearFadeDistance=0.5
; Fade the effect out with distance (fog, end of the game's RT range), metres
FadeStart=250
FadeEnd=500
; Strength multiplier while the player is in an interior / during cutscenes
InteriorStrength=0.0
CutsceneStrength=1.0
; 0 off, 1 sky visibility ratio, 2 sun visibility, 3 normals, 4 depth, 5 sky irradiance,
; 6 TLAS alignment (green = the game's BVH matches the depth buffer), 7 final multiplier, 8 history
DebugView=0

[Camera]
; Camera samples come from ScriptHookV natives on the game thread and can lag the frame being
; rendered by a frame or two. auto = measured by the calibration probe, or 0..3.
Latency=auto
; Space of the game's TLAS: auto (probe), world, camera
TlasSpace=auto
; Depth encoding: auto (from the depth clear value), reversed, reversed_infinite, standard
DepthMode=auto
; Multiplier of tan(fov/2) if the game's projection differs from the reported FOV
FovScale=1.0
CalibrationProbe=1
; Relighting starts once the probe's best hypothesis matches the depth buffer at least this well
; (fraction of probe rays). Debug views are always shown.
MinCalibrationScore=0.35
; 1 = relight even while the calibration has not passed (the occlusion may be misaligned).
ForceRelight=0

[Detection]
; Which float-format render-target binding after the G-buffer is the HDR lighting pass to relight
; (0 = the first). Use the frame dump (NumpadDecimal) to pick another one.
CompositeCandidate=0
; Overrides (auto = analyse the frame): ordinal of the binding within its command list
GBufferOrdinal=auto
CompositeOrdinal=auto
; Scene TLAS: auto (largest recently built) or the n-th distinct TLAS seen
TlasSelect=auto
; Clone the game's TLAS right after its build (safe against multi-buffering / async rebuilds)
TlasClone=1
; Frames the detected structure must stay identical before injection starts
StableFrames=3

[Sky]
; Relative sun illuminance (the relighting uses ratios, so this mainly balances sun vs. sky)
SunIntensity=1.0
MoonIntensity=0.0000025
; Aerosol density multiplier (haze)
MieScale=1.0
GroundAlbedo=0.3
; Sun orbit (common:/data/levels/gta5/time.xml): sunrise 06:00, sunset 20:00, sun_roll 122
SunRoll=122
DayStartHour=6
DayLengthHours=14
SunAzimuthOffset=0
MoonRoll=122
