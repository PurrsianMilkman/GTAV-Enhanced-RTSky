name: release

# Publishes a GitHub release with RTSky-<tag>.zip (+ SHA-256) attached, built with MSVC.
#   * push a tag such as v0.1.0 or v0.1.0-alpha, or
#   * run this workflow from the Actions tab ("Run workflow") with a tag name: the tag is created on
#     the commit the workflow runs on (normally the head of main).
# Tags with a hyphen (alpha, beta, rc) become pre-releases. Re-running for an existing release
# replaces its assets.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0-alpha"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag name
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$env:TAG' is not of the form v1.2.3 or v1.2.3-suffix"
          }

      - name: Configure (MSVC x64, Windows SDK DXC)
        shell: pwsh
        run: cmake -S . -B build -A x64 -DRTSKY_BUILD_TESTS=ON "-DRTSKY_VERSION_STRING=$env:TAG"

      - name: Build
        run: cmake --build build --config Release

      - name: Math tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $name = "RTSky-$env:TAG"
          New-Item -ItemType Directory -Force "$name/docs" | Out-Null
          Copy-Item build/Release/RTSky.asi "$name/"
          Copy-Item config/RTSky.ini "$name/"
          Copy-Item README.md, LICENSE "$name/"
          Copy-Item docs/*.md "$name/docs/"
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $assets = @("RTSky-$tag.zip", "RTSky-$tag.zip.sha256")
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Release exists (re-run): replace its assets.
            gh release upload $tag @assets --clobber
            exit $LASTEXITCODE
          }
          $flags = @()
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          $notes = @"
          RTSky $tag - ray-traced sky lighting for GTA V Enhanced (story mode only).

          **Status:** alpha, not yet tested in game. Please report how it behaves.

          **Install:** copy ``RTSky.asi`` and ``RTSky.ini`` into the game folder next to ScriptHookV and its ASI loader. Ray tracing must be enabled in the game. See README.md in the zip.

          **Testing:** after a minute of gameplay, press Ctrl+F11 and open an *In-game test report* issue with ``RTSky.log`` and ``RTSky_frame.log`` attached.
          "@
          # --target creates the tag on this commit when it does not exist yet (workflow_dispatch).
          gh release create $tag @assets --target $env:GITHUB_SHA --title "RTSky $tag" --notes $notes @flags
