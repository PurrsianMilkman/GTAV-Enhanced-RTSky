name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC x64, Windows SDK DXC)
        run: cmake -S . -B build -A x64 -DRTSKY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Math tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/RTSky.asi dist/
          Copy-Item config/RTSky.ini dist/
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: RTSky
          path: dist/
